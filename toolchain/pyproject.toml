[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mfc"
dynamic = ["version"]
dependencies = [
    # General
    "rich",
    "wheel",
    "PyYAML",
    "argparse",
    "dataclasses",
    "fastjsonschema<2.22; python_version < '3.10'",
    "fastjsonschema; python_version >= '3.10'",
    "rapidfuzz",  # For "did you mean?" typo suggestions

    # Build System
    "fypp",

    # Running Cases
    "mako",

    # Code Health
    "typos",
    "ruff==0.6.5",
    "ffmt==0.4.5",
    "ansi2txt",
    "pytest",

    # Profiling
    "numpy",
    "pandas",

    # Chemistry
    "cantera>=3.1.0",
    # Surface (heterogeneous) kinetics generation is not in a release yet, so this
    # tracks pyrometheus/pyrometheus#118 until it lands. A version pin is still
    # wanted once it does: get_creation_destruction_rates and
    # pyrometheus.flamelets (mixing-layer examples) both need a floor.
    #
    # When #118 merges, repoint this at the merge commit on main -- NOT at a
    # release, and do not let the branch be deleted first. Every mfc.sh run
    # reinstalls when this file changes, so a pin naming a branch that no longer
    # exists fails the install outright, for everyone, not only surface users.
    # Pyrometheus releases are months apart, so the version bound has to wait for
    # a release that actually carries the generator.
    "pyrometheus @ git+https://github.com/pyrometheus/pyrometheus.git@surface-kinetics",
    "jax",  # flamelet IC solve in the reacting mixing-layer examples (via pyrometheus.flamelets)
    "scipy",  # flamelet IC interpolation (scipy.interpolate) in the reacting mixing-layer examples

    # Frontier Profiling
    "astunparse==1.6.2",
    "pymongo",
    "tabulate",

    # Visualization (./mfc.sh viz)
    "matplotlib",
    "h5py",
    "imageio>=2.33",
    "imageio-ffmpeg>=0.5.0",
    "plotext>=5.2.0",
    "textual>=0.47.0",
    "textual-plotext>=0.2.0",
    "dash>=2.0",
    "plotly",
    "kaleido",
    "PyTurboJPEG<2.0",  # 2.x requires libjpeg-turbo>=3; most systems ship 2.x
    "scikit-image",
    "tqdm",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
relative_to = "pyproject.toml"
version_file = "mfc/_version.py"

[tool.hatch.build.hooks.vcs]
version-file = "mfc/_version.py"
